# Runs the scan on GitHub's machines, free for public repos and well inside the
# free minutes for private ones. Preferred over cron on a laptop, which only
# fires when the lid is open.
name: DipDector daily scan

on:
  schedule:
    # 21:45 UTC on weekdays. US markets close at 20:00 or 21:00 UTC depending
    # on daylight saving, so this leaves a margin for the daily bar to settle.
    # GitHub's scheduler is best-effort and can run late; that is fine here.
    - cron: "45 21 * * 1-5"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

concurrency:
  group: dipdector-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # needed to commit the state file back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # State lives in the repo so alert de-duplication survives between runs.
      # Without it you get emailed about the same event every single day.
      - name: Run scan
        env:
          ALERT_EMAIL:       ${{ secrets.ALERT_EMAIL }}
          EMAIL_PROVIDER:    smtp
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:     ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER:       ${{ secrets.SMTP_SENDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m dipdector.daily \
            --provider yfinance \
            --level INVESTIGATE \
            --state state/alert_state.json \
            --db state/dipdector.duckdb \
            --save-report state/last_report.html

      - name: Persist alert state
        run: |
          git config user.name  "dipdector-bot"
          git config user.email "dipdector-bot@users.noreply.github.com"
          git add state/ || true
          git diff --staged --quiet || git commit -m "state: scan $(date -u +%F)"
          git push || echo "nothing to push"

      # So a silent failure doesn't look like a quiet market.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dipdector-failure-${{ github.run_id }}
          path: state/
          if-no-files-found: ignore
