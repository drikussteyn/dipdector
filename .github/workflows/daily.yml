# Runs the scan on GitHub's machines: free for public repos, and well inside
# the free minutes for private ones. Preferred over cron on a laptop, which
# only fires when the lid is open.
#
# The job does three things that have to happen together: scan, publish the
# report pages, and commit both the pages and the alert state back to the
# repository. The state file is what stops the same event being emailed every
# day; the pages are what the email links to.
name: DipDector daily scan

on:
  schedule:
    # 21:45 UTC on weekdays. US markets close at 20:00 or 21:00 UTC depending
    # on daylight saving, so this leaves a margin for the daily bar to settle.
    # GitHub's scheduler is best-effort and can run late under load; that is
    # fine here, because daily bars do not change after the close.
    - cron: "45 21 * * 1-5"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
    inputs:
      test_email:
        # A green run proves the scan works. It does NOT prove the mail can
        # leave the building, because on a quiet day nothing is sent — and
        # quiet is this job's normal state. Waiting for the 20-run heartbeat
        # to find out is how you end up discovering a dead channel on the one
        # day in six months it carried something.
        description: "Send an 'all quiet' note now, to prove mail delivery works"
        type: boolean
        default: false

concurrency:
  group: dipdector-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # needed to commit the pages and state back

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.12 or newer is required, not a preference: charts.py uses a
          # backslash inside an f-string expression, which is a SyntaxError
          # before 3.12.
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scan
        env:
          ALERT_EMAIL:       ${{ secrets.ALERT_EMAIL }}
          # This is the ONLY place the route is chosen. The run command below
          # deliberately does not pass --sender, because that flag overrides
          # this variable: having both meant two settings that had to agree,
          # and the day they disagreed the job could not send at all.
          #
          # Resend, because it is one key and no App Password. The cost is
          # known and real: on the free tier without a verified domain the
          # mail leaves as onboarding@resend.dev, an address shared by every
          # unverified account on the platform, and Gmail files it as spam.
          # WHITELIST THAT SENDER. A detector that fires twice a year is
          # worth nothing if its one email lands somewhere you never look —
          # you do not go hunting in spam for a warning you did not know was
          # coming.
          #
          # Verifying a domain and setting RESEND_FROM removes the problem.
          # So does EMAIL_PROVIDER=smtp with the SMTP_* secrets below, which
          # is why they stay wired up.
          EMAIL_PROVIDER:    resend
          RESEND_API_KEY:    ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM:       ${{ secrets.RESEND_FROM }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:     ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER:       ${{ secrets.SMTP_SENDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional repository variables (Settings -> Variables, not Secrets —
          # a model id is not a secret). Unset falls back to the code default:
          # Opus for the judgement, Haiku for the search pass.
          DIPDECTOR_MODEL:        ${{ vars.DIPDECTOR_MODEL }}
          DIPDECTOR_SEARCH_MODEL: ${{ vars.DIPDECTOR_SEARCH_MODEL }}
          # Derived, not a secret: Pages serves a project site at
          # https://<owner>.github.io/<repo>. This is what makes the links in
          # the email absolute and clickable.
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Normally every 20th quiet run. Set to 1 by the test_email input,
          # which turns the next quiet run into a delivery test — the note it
          # sends is the same one the schedule sends, so passing it means the
          # real path works, not a special-cased one. Empty on a scheduled
          # run, hence the fallback.
          HEARTBEAT_EVERY: ${{ inputs.test_email && '1' || '20' }}
        # Exit codes are meaningful here: 0 = nothing fired, 10 = alerts were
        # sent, anything else = a real failure. 10 is a success, so it must be
        # absorbed — otherwise every day the detector actually works would be
        # reported as a failed run, and the failure notification would become
        # noise you learn to ignore.
        run: |
          set +e
          python -m dipdector.daily \
            --provider yfinance \
            --level INVESTIGATE \
            --heartbeat-every "$HEARTBEAT_EVERY" \
            --state state/alert_state.json \
            --db state/dipdector.duckdb \
            --publish-dir docs
          code=$?
          set -e
          case "$code" in
            0)  echo "Scan complete: nothing met the trigger conditions." ;;
            10) echo "Scan complete: alerts sent." ;;
            *)  echo "Scan FAILED with exit code $code."; exit "$code" ;;
          esac

      - name: Commit pages and alert state
        # Runs even when the scan step failed, and that is the point. A failed
        # step skips everything after it by default, so a run that scanned
        # correctly but could not send the email committed nothing at all —
        # the archive's last-scan date froze at the last good run and the site
        # became indistinguishable from a dead job. The scan writes its state
        # and pages before it is allowed to fail, so there is something worth
        # committing here even on a red run. Cancellation is the exception:
        # that state is genuinely half-written.
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "dipdector-bot"
          git config user.email "dipdector-bot@users.noreply.github.com"
          git add docs/ state/ || true
          git diff --staged --quiet || git commit -m "scan $(date -u +%F)"
          git push || echo "nothing to push"

      # So a silent failure does not look like a quiet market.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dipdector-failure-${{ github.run_id }}
          path: |
            state/
            docs/
          if-no-files-found: ignore
